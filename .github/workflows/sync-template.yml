name: Sync template to Community Apps repo

# Copies autoextract.xml into rcodehub/Unraid-CA-Apps (templates/autoextract.xml)
# whenever it changes on main. Needs a repository secret named CA_REPO_TOKEN:
# a fine-grained personal access token with "Contents: Read and write" on the
# Unraid-CA-Apps repository only.

on:
  push:
    branches: [main]
    paths: [autoextract.xml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for the token
        env:
          CA_TOKEN: ${{ secrets.CA_REPO_TOKEN }}
        run: |
          if [ -z "$CA_TOKEN" ]; then
            echo "::error::Repository secret CA_REPO_TOKEN is not set (fine-grained PAT with Contents read/write on rcodehub/Unraid-CA-Apps)."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          repository: rcodehub/Unraid-CA-Apps
          ref: main
          token: ${{ secrets.CA_REPO_TOKEN }}
          path: ca

      - name: Copy template and push
        run: |
          cp autoextract.xml ca/templates/autoextract.xml
          cd ca
          if [ -z "$(git status --porcelain)" ]; then
            echo "Template already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add templates/autoextract.xml
          git commit -m "Update autoextract template from ${GITHUB_REPOSITORY}@${GITHUB_SHA::7}"
          git push origin HEAD:main
