services:
  autoextract:
    image: ghcr.io/rcodehub/autoextract:latest
    container_name: autoextract
    restart: unless-stopped
    ports:
      - "8844:8080"                                # web UI
    environment:
      - TZ=America/New_York
      - UI_USERNAME=admin
      - UI_PASSWORD=change-me                      # blank = no login
    volumes:
      - /mnt/user/appdata/autoextract:/data        # settings, history, stats, logs
      - /mnt/user/downloads:/downloads             # folder to scan
      - /mnt/user/trash:/trash                     # optional: processed archives/junk are moved here
      # - /mnt/user:/mnt/user                      # optional: all shares (Extract folder on any share)
