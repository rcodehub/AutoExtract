services:
  autoextract:
    image: ghcr.io/rcodehub/autoextract:latest
    build: .                       # or build it locally: docker compose build
    container_name: autoextract
    restart: unless-stopped
    ports:
      - "8844:8080"                # web UI
    environment:
      - TZ=America/New_York
      # Optional login for the web UI (strongly recommended):
      - UI_USERNAME=admin
      - UI_PASSWORD=change-me
    volumes:
      - /mnt/user/appdata/autoextract:/data       # settings, history, logs
      - /mnt/user/downloads:/downloads                  # the folder to scan
      - /mnt/user/trash:/trash                          # optional: processed archives/junk are moved here
